<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>QR Dinâmico</title>
</head>
<body>

<script>
const clientes = {
    "Cliente001": "https://www.google.com/"
};

const cliente = new URLSearchParams(window.location.search).get("cliente");

if (cliente && clientes[cliente]) {
    window.location.replace(clientes[cliente]);
} else {
    document.body.innerHTML = `
        <h2>QR Dinâmico</h2>
        <p>Cliente não encontrado.</p>
    `;
}
</script>

</body>
</html>
