<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerador de QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>

<h2>Gerar QR Code</h2>

<input id="cliente" placeholder="Ex: Cliente001">

<button onclick="gerarQR()">Gerar QR Code</button>

<div id="qrcode"></div>

<script>
function gerarQR() {
    const cliente = document.getElementById("cliente").value.trim();

    if (!cliente) {
        alert("Digite o código do cliente.");
        return;
    }

    document.getElementById("qrcode").innerHTML = "";

    const link = "https://rodrigogomesoliveira11-hue.github.io/Qr-dinamico/?cliente="
        + encodeURIComponent(cliente);

    new QRCode(document.getElementById("qrcode"), {
        text: link,
        width: 300,
        height: 300
    });
}
</script>

</body>
</html>
